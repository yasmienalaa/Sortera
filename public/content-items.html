<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قائمة المحتوى — HBJ Archive</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="main">
      <div class="page-header">
        <h1 class="page-title" id="pageTitle">المحتوى</h1>
        <button class="btn btn-primary" id="addBtn" style="width:auto;">+ إضافة عنصر</button>
      </div>

      <div class="card table-card">
        <div class="table-toolbar">
          <div style="display:flex; gap:10px;">
            <select id="lifecycleFilter" class="btn btn-secondary" style="width:auto;">
              <option value="">كل الحالات</option>
              <option value="RAW">خام</option>
              <option value="IN_PRODUCTION">قيد الإنتاج</option>
              <option value="READY_FOR_REVIEW">جاهز للمراجعة</option>
              <option value="PUBLISHED">منشور</option>
              <option value="ARCHIVED">مؤرشف</option>
            </select>
          </div>
          <input type="search" id="searchBox" placeholder="بحث..." class="btn btn-secondary" style="width:220px; text-align:right;" />
        </div>

        <table class="data-table">
          <thead>
            <tr>
              <th>العنوان</th>
              <th>الحالة</th>
              <th>مستوى السرية</th>
              <th>تاريخ الإضافة</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display:none;">
          <div class="avatar-lg">🗂</div>
          لا توجد عناصر تطابق التصفية الحالية
        </div>
      </div>
    </main>
  </div>

  <!-- Slide-in panel, same pattern as the original site's "إضافة حدث" screen -->
  <div id="addOverlay" style="display:none; position:fixed; inset:0; background:rgba(16,24,40,.4); z-index:100;">
    <div style="position:absolute; top:0; left:0; height:100%; width:min(480px, 100%); background:var(--color-surface); box-shadow:-4px 0 24px rgba(0,0,0,.1); padding:32px; overflow-y:auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h2 style="margin:0; font-size:20px; font-weight:800;" id="addPanelTitle">إضافة عنصر</h2>
        <button id="closeAddPanel" style="background:none; border:none; font-size:20px; color:var(--color-text-muted);">✕</button>
      </div>

      <div id="addFormError" class="form-error"></div>

      <form id="addForm">
        <div class="field" id="fileFieldWrap">
          <label>الملف</label>
          <input type="file" id="fFile" style="width:100%; padding:10px; border:1px solid var(--color-border); border-radius:var(--radius-md);" />
        </div>
        <div class="field">
          <label>العنوان</label>
          <input type="text" id="fTitle" required style="width:100%; padding:12px 14px; border:1px solid var(--color-border); border-radius:var(--radius-md);" />
        </div>
        <div class="field">
          <label>مستوى السرية</label>
          <select id="fConf" style="width:100%; padding:12px 14px; border:1px solid var(--color-border); border-radius:var(--radius-md);">
            <option value="INTERNAL">داخلي</option>
            <option value="PUBLIC">عام</option>
            <option value="CONFIDENTIAL">سري</option>
            <option value="RESTRICTED">مقيّد</option>
          </select>
        </div>
        <div class="field">
          <label>معرّف الحدث (اختياري)</label>
          <input type="text" id="fEventId" style="width:100%; padding:12px 14px; border:1px solid var(--color-border); border-radius:var(--radius-md);" />
        </div>
        <button type="submit" class="btn btn-primary" id="submitAddBtn"><span id="submitAddLabel">حفظ</span></button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"><span id="toastText"></span></div>

  <script src="/js/api.js"></script>
  <script src="/js/shell.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const contentType = params.get('type') || '';
    const TYPE_LABELS = { VIDEO: 'الفيديوهات', IMAGE: 'الصور', DOCUMENT: 'المستندات', AUDIO: 'الملفات الصوتية' };
    const LIFECYCLE_LABELS = { RAW: 'خام', IN_PRODUCTION: 'قيد الإنتاج', READY_FOR_REVIEW: 'جاهز للمراجعة', PUBLISHED: 'منشور', ARCHIVED: 'مؤرشف' };
    const LIFECYCLE_BADGE = { RAW: 'badge-neutral', IN_PRODUCTION: 'badge-warning', READY_FOR_REVIEW: 'badge-warning', PUBLISHED: 'badge-success', ARCHIVED: 'badge-neutral' };
    const CONF_LABELS = { PUBLIC: 'عام', INTERNAL: 'داخلي', CONFIDENTIAL: 'سري', RESTRICTED: 'مقيّد' };
    const CONF_BADGE = { PUBLIC: 'badge-success', INTERNAL: 'badge-neutral', CONFIDENTIAL: 'badge-warning', RESTRICTED: 'badge-danger' };

    if (HBJ.requireAuth()) {
      renderShell(contentType ? `/content-items.html?type=${contentType}` : '/content-items.html');
      document.getElementById('pageTitle').textContent = TYPE_LABELS[contentType] || 'كل المحتوى';
      load();
    }

    document.getElementById('lifecycleFilter').addEventListener('change', load);
    document.getElementById('searchBox').addEventListener('input', debounce(load, 300));

    // ---- Add panel ----
    const addOverlay = document.getElementById('addOverlay');
    document.getElementById('addBtn').addEventListener('click', () => {
      document.getElementById('addPanelTitle').textContent = `إضافة ${TYPE_LABELS[contentType] || 'عنصر'}`;
      document.getElementById('fileFieldWrap').style.display = contentType ? 'block' : 'none';
      addOverlay.style.display = 'block';
    });
    document.getElementById('closeAddPanel').addEventListener('click', () => { addOverlay.style.display = 'none'; });
    addOverlay.addEventListener('click', (e) => { if (e.target === addOverlay) addOverlay.style.display = 'none'; });

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('addFormError');
      errorBox.classList.remove('visible');
      const submitBtn = document.getElementById('submitAddBtn');
      const submitLabel = document.getElementById('submitAddLabel');
      submitBtn.disabled = true;
      submitLabel.innerHTML = '<span class="spinner"></span>';

      const title = document.getElementById('fTitle').value.trim();
      const confidentialityLevel = document.getElementById('fConf').value;
      const eventId = document.getElementById('fEventId').value.trim() || undefined;
      const file = document.getElementById('fFile').files[0];

      try {
        if (contentType === 'VIDEO' || contentType === 'IMAGE') {
          if (!file) throw new Error('لازم تختاري ملف');
          await uploadFile('/media', file, { contentType, title, confidentialityLevel, eventId });
        } else if (contentType === 'DOCUMENT') {
          if (!file) throw new Error('لازم تختاري ملف');
          await uploadFile('/documents', file, { title, confidentialityLevel, eventId });
        } else {
          // No specific type context (viewing "كل المحتوى") — falls back to
          // a metadata-only record via the generic API, no file attached.
          await HBJ.api('/content-items', {
            method: 'POST',
            body: JSON.stringify({ contentType: 'DOCUMENT', title, confidentialityLevel, eventId }),
          });
        }
        addOverlay.style.display = 'none';
        document.getElementById('addForm').reset();
        showToast('تمت الإضافة بنجاح');
        load();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
        submitLabel.textContent = 'حفظ';
      }
    });

    /** multipart upload — HBJ.api() always sends JSON, so this bypasses it
     * deliberately for the two file-upload endpoints. */
    async function uploadFile(path, file, fields) {
      const formData = new FormData();
      formData.append('file', file);
      Object.entries(fields).forEach(([k, v]) => { if (v !== undefined) formData.append(k, v); });

      const res = await fetch(path, {
        method: 'POST',
        headers: { Authorization: `Bearer ${HBJ.getAccessToken()}` },
        body: formData,
      });
      const body = await res.json();
      if (!res.ok) throw new Error(Array.isArray(body.message) ? body.message.join(', ') : body.message || 'فشل الرفع');
      return body;
    }

    async function load() {
      try {
        const qs = new URLSearchParams();
        if (contentType) qs.set('contentType', contentType);
        const items = await HBJ.api(`/content-items?${qs.toString()}`);

        const lifecycleFilter = document.getElementById('lifecycleFilter').value;
        const search = document.getElementById('searchBox').value.trim().toLowerCase();
        const filtered = items.filter((i) =>
          (!lifecycleFilter || i.lifecycleStatus === lifecycleFilter) &&
          (!search || i.title.toLowerCase().includes(search))
        );

        renderTable(filtered);
      } catch (err) {
        showToast(err.message, true);
      }
    }

    function renderTable(items) {
      const tbody = document.getElementById('tableBody');
      const empty = document.getElementById('emptyState');
      if (items.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      tbody.innerHTML = items.map((item) => `
        <tr>
          <td>${escapeHtml(item.title)}</td>
          <td><span class="badge ${LIFECYCLE_BADGE[item.lifecycleStatus] || 'badge-neutral'}">${LIFECYCLE_LABELS[item.lifecycleStatus] || item.lifecycleStatus}</span></td>
          <td><span class="badge ${CONF_BADGE[item.confidentialityLevel] || 'badge-neutral'}">${CONF_LABELS[item.confidentialityLevel] || item.confidentialityLevel}</span></td>
          <td>${new Date(item.createdAt).toLocaleDateString('ar-EG')}</td>
          <td><a href="/content-item-detail.html?id=${item.id}" title="عرض">👁</a></td>
        </tr>
      `).join('');
    }

    function debounce(fn, ms) {
      let t;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    function showToast(text, isError) {
      const toast = document.getElementById('toast');
      document.getElementById('toastText').textContent = text;
      toast.classList.toggle('error', !!isError);
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 4000);
    }
  </script>
</body>
</html>
