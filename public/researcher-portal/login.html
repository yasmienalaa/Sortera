<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — بوابة الباحث الخارجي</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-icon"><svg class="icon" width="26" height="26" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M17 17l-4-4"/></svg></div>
      <h1 class="auth-title">بوابة الباحث الخارجي</h1>
      <p class="auth-subtitle">تسجيل الدخول إلى حسابك</p>

      <div id="formError" class="form-error"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" required style="width:100%; padding:12px 14px; border:1px solid var(--color-border); border-radius:var(--radius-md);" />
        </div>
        <div class="field">
          <label for="password">كلمة المرور</label>
          <div class="input-wrap">
            <input type="password" id="password" required style="width:100%; padding:12px 14px; border:1px solid var(--color-border); border-radius:var(--radius-md);" />
            <button type="button" class="icon-suffix icon-btn" id="togglePassword" aria-label="إظهار كلمة المرور"><svg class="icon" width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10Z"/><circle cx="10" cy="10" r="2.3"/></svg></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn"><span id="submitLabel">تسجيل الدخول</span></button>
      </form>
      <p style="margin-top:16px; font-size:13px;"><a href="/researcher-portal/register.html" style="color:var(--color-primary);">ليس لديك حساب؟ أنشئ حسابًا جديدًا</a></p>
    </div>
  </div>

  <script src="/researcher-portal/js/rp-api.js"></script>
  <script>
    if (RP.getToken()) location.href = '/researcher-portal/browse.html';

    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    toggleBtn.addEventListener('click', () => {
      const showing = passwordInput.type === 'text';
      passwordInput.type = showing ? 'password' : 'text';
      toggleBtn.setAttribute('aria-label', showing ? 'إظهار كلمة المرور' : 'إخفاء كلمة المرور');
      toggleBtn.innerHTML = showing
        ? '<svg class="icon" width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10Z"/><circle cx="10" cy="10" r="2.3"/></svg>'
        : '<svg class="icon" width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l14 14"/><path d="M8.5 5.1A8.8 8.8 0 0 1 10 5c5 0 8 5 8 5a13.6 13.6 0 0 1-3.1 3.6M6 6.4C3.4 8 2 10 2 10s3 5 8 5c1 0 1.9-.2 2.7-.5"/><path d="M11.6 11.6a2.3 2.3 0 0 1-3.2-3.2"/></svg>';
    });

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('formError');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('visible');
      submitBtn.disabled = true;
      try {
        const result = await RP.api('/researcher-portal/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        RP.setToken(result.accessToken);
        RP.setResearcher(result.researcher);
        location.href = '/researcher-portal/browse.html';
      } catch (err) {
        errorBox.textContent = /invalid/i.test(err.message) ? 'البريد الإلكتروني أو كلمة المرور غير صحيحة' : err.message;
        errorBox.classList.add('visible');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
