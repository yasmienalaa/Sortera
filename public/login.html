<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — HBJ Archive</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-icon"><svg class="icon" width="26" height="26" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="6.5" r="3.3"/><path d="M3.3 17c.7-3.6 3.3-5.7 6.7-5.7s6 2.1 6.7 5.7"/></svg></div>
      <h1 class="auth-title">تسجيل الدخول إلى حسابك</h1>
      <p class="auth-subtitle">الرجاء إدخال بياناتك لتسجيل الدخول</p>

      <div id="formError" class="form-error"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <div class="input-wrap">
            <input type="email" id="email" name="email" required autocomplete="username" />
            <span class="icon-suffix"><svg class="icon" width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4.5" width="15" height="11" rx="2"/><path d="M3 5.5l7 5.5 7-5.5"/></svg></span>
          </div>
        </div>
        <div class="field">
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <label for="password">كلمة المرور</label>
            <a href="/forgot-password.html" style="font-size:12px; color:var(--color-primary);">نسيت كلمة المرور؟</a>
          </div>
          <div class="input-wrap">
            <input type="password" id="password" name="password" required autocomplete="current-password" />
            <button type="button" class="icon-suffix icon-btn" id="togglePassword" aria-label="إظهار كلمة المرور"><svg class="icon" width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10Z"/><circle cx="10" cy="10" r="2.3"/></svg></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">
          <span id="submitLabel">تسجيل الدخول</span>
        </button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    toggleBtn.addEventListener('click', () => {
      const showing = passwordInput.type === 'text';
      passwordInput.type = showing ? 'password' : 'text';
      toggleBtn.setAttribute('aria-label', showing ? 'إظهار كلمة المرور' : 'إخفاء كلمة المرور');
      toggleBtn.innerHTML = showing
        ? '<svg class="icon" width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10Z"/><circle cx="10" cy="10" r="2.3"/></svg>'
        : '<svg class="icon" width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l14 14"/><path d="M8.5 5.1A8.8 8.8 0 0 1 10 5c5 0 8 5 8 5a13.6 13.6 0 0 1-3.1 3.6M6 6.4C3.4 8 2 10 2 10s3 5 8 5c1 0 1.9-.2 2.7-.5"/><path d="M11.6 11.6a2.3 2.3 0 0 1-3.2-3.2"/></svg>';
    });

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('formError');
    const submitBtn = document.getElementById('submitBtn');
    const submitLabel = document.getElementById('submitLabel');

    // Already have a session? skip straight to the dashboard.
    if (HBJ.getAccessToken()) location.href = '/dashboard.html';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('visible');
      submitBtn.disabled = true;
      submitLabel.innerHTML = '<span class="spinner"></span>';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const deviceToken = HBJ.getDeviceToken();

      try {
        const result = await HBJ.api('/auth/login', {
          method: 'POST',
          body: JSON.stringify(deviceToken ? { email, password, deviceToken } : { email, password }),
        });

        if (result.requiresTwoFactor) {
          // Hand off to the 2FA screen via sessionStorage — the tempToken
          // is short-lived (10 min) and single-purpose, no need to persist
          // it in localStorage.
          sessionStorage.setItem('hbj_temp_token', result.tempToken);
          sessionStorage.setItem('hbj_2fa_setup_required', result.twoFactorSetupRequired ? '1' : '');
          location.href = '/two-factor.html';
          return;
        }

        HBJ.setAccessToken(result.accessToken);
        HBJ.setUser(result.user);
        location.href = '/dashboard.html';
      } catch (err) {
        errorBox.textContent = err.message === 'Unauthorized' || /invalid/i.test(err.message)
          ? 'البريد الإلكتروني أو كلمة المرور غير صحيحة'
          : err.message;
        errorBox.classList.add('visible');
        submitBtn.disabled = false;
        submitLabel.textContent = 'تسجيل الدخول';
      }
    });
  </script>
</body>
</html>
