<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلبات وصول الباحثين — HBJ Archive</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="main">
      <div class="page-header"><h1 class="page-title">طلبات وصول الباحثين الخارجيين</h1></div>

      <div class="card table-card">
        <table class="data-table">
          <thead><tr><th>الباحث</th><th>البريد الإلكتروني</th><th>معرّف العنصر</th><th>تاريخ الطلب</th><th>إجراء</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display:none;">لا توجد طلبات معلّقة</div>
      </div>
    </main>
  </div>
  <div id="toast" class="toast"><span id="toastText"></span></div>

  <script src="/js/api.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/shell.js"></script>
  <script>
    if (HBJ.requireAuth()) { renderShell('/settings.html'); load(); }

    async function load() {
      try {
        const requests = await HBJ.api('/access-requests/pending');
        const tbody = document.getElementById('tableBody');
        if (requests.length === 0) { document.getElementById('emptyState').style.display = 'block'; tbody.innerHTML=''; return; }
        document.getElementById('emptyState').style.display = 'none';
        tbody.innerHTML = requests.map((r) => `
          <tr id="req-${r.id}">
            <td>${escapeHtml(r.researcher?.fullName || '—')}</td>
            <td>${escapeHtml(r.researcher?.email || '—')}</td>
            <td><code style="font-size:11px;">${r.resourceId.slice(0,8)}…</code></td>
            <td>${new Date(r.createdAt).toLocaleDateString('ar-EG')}</td>
            <td style="display:flex; gap:8px;">
              <button class="btn btn-primary" style="width:auto; padding:6px 14px;" onclick="decide('${r.id}','approve')">موافقة</button>
              <button class="btn btn-secondary" style="width:auto; padding:6px 14px;" onclick="decide('${r.id}','reject')">رفض</button>
            </td>
          </tr>
        `).join('');
      } catch (err) { showToast(err.message, true); }
    }

    async function decide(id, action) {
      try {
        await HBJ.api(`/access-requests/${id}/${action}`, { method: 'PATCH' });
        document.getElementById(`req-${id}`)?.remove();
        showToast(action === 'approve' ? 'تمت الموافقة' : 'تم الرفض');
      } catch (err) { showToast(err.message, true); }
    }

    function showToast(text, isError) {
      const toast = document.getElementById('toast');
      document.getElementById('toastText').textContent = text;
      toast.classList.toggle('error', !!isError);
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 4000);
    }
  </script>
</body>
</html>
