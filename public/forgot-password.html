<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نسيت كلمة المرور — HBJ Archive</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-icon">🔑</div>
      <h1 class="auth-title">نسيت كلمة المرور؟</h1>
      <p class="auth-subtitle">اكتبي إيميلك وهنبعتلك رابط إعادة تعيين</p>

      <div id="formError" class="form-error"></div>
      <div id="formSuccess" class="form-error" style="background:var(--color-success-bg); color:var(--color-success-text);"></div>

      <form id="forgotForm">
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" required style="width:100%; padding:12px 14px; border:1px solid var(--color-border); border-radius:var(--radius-md);" />
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn"><span id="submitLabel">إرسال رابط إعادة التعيين</span></button>
      </form>
      <p style="margin-top:16px; font-size:13px;"><a href="/login.html" style="color:var(--color-primary);">رجوع لتسجيل الدخول</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('forgotForm');
    const errorBox = document.getElementById('formError');
    const successBox = document.getElementById('formSuccess');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('visible');
      successBox.classList.remove('visible');
      submitBtn.disabled = true;

      try {
        const res = await fetch('/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() }),
        });
        const data = await res.json();
        successBox.textContent = data.message;
        successBox.classList.add('visible');
        form.reset();
      } catch (err) {
        errorBox.textContent = 'حصل خطأ، حاولي تاني';
        errorBox.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
