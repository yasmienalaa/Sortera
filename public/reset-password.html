<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعادة تعيين كلمة المرور — HBJ Archive</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-icon">🔑</div>
      <h1 class="auth-title">إعادة تعيين كلمة المرور</h1>

      <div id="formError" class="form-error"></div>

      <form id="resetForm">
        <div class="field">
          <label for="newPassword">كلمة المرور الجديدة</label>
          <input type="password" id="newPassword" required minlength="8" style="width:100%; padding:12px 14px; border:1px solid var(--color-border); border-radius:var(--radius-md);" />
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn"><span id="submitLabel">تغيير كلمة المرور</span></button>
      </form>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(location.search).get('token');
    const form = document.getElementById('resetForm');
    const errorBox = document.getElementById('formError');
    const submitBtn = document.getElementById('submitBtn');

    if (!token) {
      errorBox.textContent = 'الرابط غير صالح — تأكدي إنك فتحتي نفس اللينك اللي وصلك بالإيميل بالكامل';
      errorBox.classList.add('visible');
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('visible');
      submitBtn.disabled = true;

      try {
        const res = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: document.getElementById('newPassword').value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'فشلت العملية');
        alert('تم تغيير كلمة المرور بنجاح — سجّلي دخول من جديد');
        location.href = '/login.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('visible');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
