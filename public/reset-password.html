<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعادة تعيين كلمة المرور — HBJ Archive</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-icon"><svg class="icon" width="26" height="26" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.2" cy="13.8" r="3.3"/><path d="M8.5 11.5L15 5M12.5 8l2 2M15 5l2.3 2.3"/></svg></div>
      <h1 class="auth-title">إعادة تعيين كلمة المرور</h1>

      <div id="formError" class="form-error"></div>
      <div id="formSuccess" class="form-error" style="background:var(--color-success-bg); color:var(--color-success-text);"></div>

      <form id="resetForm">
        <div class="field">
          <label for="newPassword">كلمة المرور الجديدة</label>
          <div class="input-wrap">
            <input type="password" id="newPassword" required minlength="8" style="width:100%; padding:12px 14px; border:1px solid var(--color-border); border-radius:var(--radius-md);" />
            <button type="button" class="icon-suffix icon-btn" id="togglePassword" aria-label="إظهار كلمة المرور"><svg class="icon" width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10Z"/><circle cx="10" cy="10" r="2.3"/></svg></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn"><span id="submitLabel">تغيير كلمة المرور</span></button>
      </form>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('togglePassword');
    const newPasswordInput = document.getElementById('newPassword');
    toggleBtn.addEventListener('click', () => {
      const showing = newPasswordInput.type === 'text';
      newPasswordInput.type = showing ? 'password' : 'text';
      toggleBtn.setAttribute('aria-label', showing ? 'إظهار كلمة المرور' : 'إخفاء كلمة المرور');
      toggleBtn.innerHTML = showing
        ? '<svg class="icon" width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10Z"/><circle cx="10" cy="10" r="2.3"/></svg>'
        : '<svg class="icon" width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l14 14"/><path d="M8.5 5.1A8.8 8.8 0 0 1 10 5c5 0 8 5 8 5a13.6 13.6 0 0 1-3.1 3.6M6 6.4C3.4 8 2 10 2 10s3 5 8 5c1 0 1.9-.2 2.7-.5"/><path d="M11.6 11.6a2.3 2.3 0 0 1-3.2-3.2"/></svg>';
    });

    const token = new URLSearchParams(location.search).get('token');
    const form = document.getElementById('resetForm');
    const errorBox = document.getElementById('formError');
    const successBox = document.getElementById('formSuccess');
    const submitBtn = document.getElementById('submitBtn');

    if (!token) {
      errorBox.textContent = 'الرابط غير صالح. يرجى التأكد من فتح الرابط الكامل المرسل إلى بريدك الإلكتروني.';
      errorBox.classList.add('visible');
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('visible');
      submitBtn.disabled = true;

      try {
        const res = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: document.getElementById('newPassword').value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'تعذّر إتمام عملية إعادة التعيين');
        form.style.display = 'none';
        successBox.textContent = 'تم تغيير كلمة المرور بنجاح. سيتم تحويلك إلى صفحة تسجيل الدخول.';
        successBox.classList.add('visible');
        setTimeout(() => { location.href = '/login.html'; }, 2000);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('visible');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
