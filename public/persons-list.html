<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الشخصيات — HBJ Archive</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="main">
      <div class="page-header">
        <h1 class="page-title">الشخصيات</h1>
        <div style="display:flex; gap:10px;">
          <a href="/merge-suggestions.html" class="btn btn-secondary" style="width:auto; text-decoration:none;"><svg class="icon" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5H4A1.5 1.5 0 0 0 2.5 5v11A1.5 1.5 0 0 0 4 17.5h11a1.5 1.5 0 0 0 1.5-1.5v-4"/><path d="M11.5 2.5h6v6M17 3l-8 8"/></svg> مراجعة التكرار</a>
          <button class="btn btn-primary" style="width:auto;" id="addBtn">+ أضف شخصية</button>
        </div>
      </div>

      <div class="card table-card">
        <div class="table-toolbar">
          <input type="search" id="searchBox" placeholder="بحث بالاسم..." class="btn btn-secondary" style="width:260px; text-align:right;" />
        </div>
        <table class="data-table">
          <thead><tr><th>الاسم</th><th>الجنسية</th><th>الحالة الراهنة</th><th>تاريخ الإضافة</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display:none;">
          <div class="avatar-lg"><svg class="icon" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="2.6"/><circle cx="14" cy="8" r="2.2"/><path d="M2.5 16.5c.4-2.7 2.2-4.3 4.5-4.3s4.1 1.6 4.5 4.3"/><path d="M12.3 12.4c1.9.2 3.3 1.7 3.7 4.1"/></svg></div>
          لا توجد شخصيات تطابق معايير البحث
        </div>
      </div>
    </main>
  </div>

  <div id="addOverlay" style="display:none; position:fixed; inset:0; background:rgba(16,24,40,.4); z-index:100;">
    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:min(520px, 92vw); max-height:85vh; overflow-y:auto; background:var(--color-surface); border-radius:var(--radius-lg); padding:32px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="margin:0; font-size:20px; font-weight:800;">أضف الشخصية</h2>
        <button id="closeAddPanel" style="background:none; border:none; font-size:20px; color:var(--color-text-muted);"><svg class="icon" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
      </div>
      <div id="addFormError" class="form-error"></div>
      <form id="addForm">
        <div class="field"><label>اسم الشخصية</label><input id="fName" required style="width:100%; padding:12px 14px; border:1px solid var(--color-border); border-radius:var(--radius-md);" /></div>
        <div class="field"><label>الحالة الراهنة</label><textarea id="fStatus" style="width:100%; padding:12px 14px; border:1px solid var(--color-border); border-radius:var(--radius-md); min-height:70px;"></textarea></div>
        <div class="field"><label>الوصف المفصل (اختياري)</label><textarea id="fDescription" style="width:100%; padding:12px 14px; border:1px solid var(--color-border); border-radius:var(--radius-md); min-height:70px;"></textarea></div>
        <div class="field"><label>الجنسية</label><input id="fNationality" style="width:100%; padding:12px 14px; border:1px solid var(--color-border); border-radius:var(--radius-md);" /></div>
        <div class="field"><label>الموقع الشخصي (اختياري)</label><input id="fWebsite" type="url" style="width:100%; padding:12px 14px; border:1px solid var(--color-border); border-radius:var(--radius-md);" /></div>
        <button type="submit" class="btn btn-primary" id="submitBtn"><span id="submitLabel">حفظ</span></button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"><span id="toastText"></span></div>

  <script src="/js/api.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/shell.js"></script>
  <script>
    if (HBJ.requireAuth()) { renderShell('/persons-list.html'); load(); }
    document.getElementById('searchBox').addEventListener('input', debounce(load, 300));

    const overlay = document.getElementById('addOverlay');
    document.getElementById('addBtn').addEventListener('click', () => { overlay.style.display = 'block'; });
    document.getElementById('closeAddPanel').addEventListener('click', () => { overlay.style.display = 'none'; });
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.style.display = 'none'; });

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('addFormError');
      errorBox.classList.remove('visible');
      try {
        await HBJ.api('/characters', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('fName').value.trim(),
            currentStatus: document.getElementById('fStatus').value.trim() || undefined,
            description: document.getElementById('fDescription').value.trim() || undefined,
            nationality: document.getElementById('fNationality').value.trim() || undefined,
            personalWebsite: document.getElementById('fWebsite').value.trim() || undefined,
          }),
        });
        overlay.style.display = 'none';
        document.getElementById('addForm').reset();
        showToast('تمت الإضافة');
        load();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('visible');
      }
    });

    async function load() {
      try {
        const search = document.getElementById('searchBox').value.trim();
        const items = await HBJ.api(`/characters${search ? `?search=${encodeURIComponent(search)}` : ''}`);
        const tbody = document.getElementById('tableBody');
        if (items.length === 0) { document.getElementById('emptyState').style.display = 'block'; tbody.innerHTML = ''; return; }
        document.getElementById('emptyState').style.display = 'none';
        tbody.innerHTML = items.map((c) => `
          <tr>
            <td><span class="avatar-sm">${escapeHtml(c.name.charAt(0))}</span>${escapeHtml(c.name)}</td>
            <td>${escapeHtml(c.nationality || '—')}</td>
            <td>${escapeHtml(c.currentStatus || '—')}</td>
            <td>${new Date(c.createdAt).toLocaleDateString('ar-EG')}</td>
          </tr>
        `).join('');
      } catch (err) { showToast(err.message, true); }
    }

    function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

    function showToast(text, isError) {
      const toast = document.getElementById('toast');
      document.getElementById('toastText').textContent = text;
      toast.classList.toggle('error', !!isError);
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 4000);
    }
  </script>
</body>
</html>
