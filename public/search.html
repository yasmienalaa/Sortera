<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البحث — HBJ Archive</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="main">
      <div class="page-header"><h1 class="page-title">البحث في الأرشيف</h1></div>

      <div class="card" style="margin-bottom:20px;">
        <div style="display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:10px; align-items:end;">
          <div class="field" style="margin:0;"><label>كلمة البحث</label>
            <input id="qInput" style="width:100%; padding:10px; border:1px solid var(--color-border); border-radius:8px;" placeholder="ابحثي في العنوان، النص المستخرج، الوسوم..." /></div>
          <div class="field" style="margin:0;"><label>النوع</label>
            <select id="typeInput" style="width:100%; padding:10px; border:1px solid var(--color-border); border-radius:8px;">
              <option value="">الكل</option><option value="VIDEO">فيديو</option><option value="IMAGE">صورة</option><option value="DOCUMENT">مستند</option>
            </select></div>
          <div class="field" style="margin:0;"><label>من تاريخ</label>
            <input id="dateFromInput" type="date" style="width:100%; padding:10px; border:1px solid var(--color-border); border-radius:8px;" /></div>
          <div class="field" style="margin:0;"><label>إلى تاريخ</label>
            <input id="dateToInput" type="date" style="width:100%; padding:10px; border:1px solid var(--color-border); border-radius:8px;" /></div>
          <button class="btn btn-primary" style="width:auto; height:42px;" id="searchBtn">بحث</button>
        </div>
        <button class="btn btn-secondary" style="width:auto; margin-top:12px; padding:6px 14px;" id="saveSearchBtn">💾 حفظ هذا البحث</button>
      </div>

      <div class="grid" style="grid-template-columns: 1fr 280px; align-items:start;">
        <div class="card table-card">
          <table class="data-table">
            <thead><tr><th>العنوان</th><th>النوع</th><th>الحالة</th><th>تاريخ الإضافة</th></tr></thead>
            <tbody id="resultsBody"></tbody>
          </table>
          <div id="emptyState" class="empty-state" style="display:none;"><div class="avatar-lg">🔍</div>مفيش نتائج مطابقة</div>
        </div>

        <div class="card">
          <h2 class="card-title">عمليات البحث المحفوظة</h2>
          <div id="savedSearchesList" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>
      </div>
    </main>
  </div>
  <div id="toast" class="toast"><span id="toastText"></span></div>

  <script src="/js/api.js"></script>
  <script src="/js/shell.js"></script>
  <script>
    const TYPE_LABELS = { VIDEO: 'فيديو', IMAGE: 'صورة', DOCUMENT: 'مستند', AUDIO: 'صوتي' };
    const LIFECYCLE_LABELS = { RAW: 'خام', IN_PRODUCTION: 'قيد الإنتاج', READY_FOR_REVIEW: 'جاهز للمراجعة', PUBLISHED: 'منشور', ARCHIVED: 'مؤرشف' };

    if (HBJ.requireAuth()) { renderShell('/search.html'); loadSavedSearches(); }

    document.getElementById('searchBtn').addEventListener('click', runSearch);
    document.getElementById('qInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });

    function currentParams() {
      const p = new URLSearchParams();
      const q = document.getElementById('qInput').value.trim();
      const type = document.getElementById('typeInput').value;
      const dateFrom = document.getElementById('dateFromInput').value;
      const dateTo = document.getElementById('dateToInput').value;
      if (q) p.set('q', q);
      if (type) p.set('contentType', type);
      if (dateFrom) p.set('dateFrom', dateFrom);
      if (dateTo) p.set('dateTo', dateTo);
      return p;
    }

    async function runSearch(overrideParams) {
      try {
        const qs = overrideParams || currentParams();
        const results = await HBJ.api(`/search?${qs.toString()}`);
        renderResults(results);
      } catch (err) { showToast(err.message, true); }
    }

    function renderResults(items) {
      const tbody = document.getElementById('resultsBody');
      const empty = document.getElementById('emptyState');
      if (items.length === 0) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
      empty.style.display = 'none';
      tbody.innerHTML = items.map((i) => `
        <tr>
          <td>${escapeHtml(i.title)}</td>
          <td><span class="badge badge-neutral">${TYPE_LABELS[i.contentType] || i.contentType}</span></td>
          <td>${LIFECYCLE_LABELS[i.lifecycleStatus] || i.lifecycleStatus}</td>
          <td>${new Date(i.createdAt).toLocaleDateString('ar-EG')}</td>
        </tr>
      `).join('');
    }

    document.getElementById('saveSearchBtn').addEventListener('click', async () => {
      const name = prompt('اسم البحث المحفوظ:');
      if (!name) return;
      const params = currentParams();
      const queryParams = Object.fromEntries(params.entries());
      try {
        await HBJ.api('/saved-searches', { method: 'POST', body: JSON.stringify({ name, queryParams }) });
        showToast('تم الحفظ');
        loadSavedSearches();
      } catch (err) { showToast(err.message, true); }
    });

    async function loadSavedSearches() {
      try {
        const saved = await HBJ.api('/saved-searches');
        const list = document.getElementById('savedSearchesList');
        if (saved.length === 0) { list.innerHTML = '<span style="color:var(--color-text-muted); font-size:13px;">لا يوجد بحث محفوظ</span>'; return; }
        list.innerHTML = saved.map((s) => `
          <div style="display:flex; justify-content:space-between; align-items:center; border:1px solid var(--color-border); border-radius:8px; padding:8px 12px;">
            <a href="#" onclick="runSaved('${s.id}'); return false;" style="color:var(--color-primary); font-size:13px;">${escapeHtml(s.name)}</a>
            <a href="#" onclick="deleteSaved('${s.id}'); return false;" style="color:var(--color-danger-text); font-size:12px;">حذف</a>
          </div>
        `).join('');
      } catch (err) { showToast(err.message, true); }
    }

    async function runSaved(id) {
      try {
        const results = await HBJ.api(`/saved-searches/${id}/run`, { method: 'POST' });
        renderResults(results);
      } catch (err) { showToast(err.message, true); }
    }

    async function deleteSaved(id) {
      try {
        await HBJ.api(`/saved-searches/${id}`, { method: 'DELETE' });
        loadSavedSearches();
      } catch (err) { showToast(err.message, true); }
    }

    function showToast(text, isError) {
      const toast = document.getElementById('toast');
      document.getElementById('toastText').textContent = text;
      toast.classList.toggle('error', !!isError);
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 4000);
    }
  </script>
</body>
</html>
