<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سجل النشاط — HBJ Archive</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="main">
      <div class="page-header"><h1 class="page-title">سجل النشاط (Audit Log)</h1></div>

      <div class="card" style="margin-bottom:20px;">
        <div style="display:flex; gap:10px; align-items:end;">
          <div class="field" style="margin:0;"><label>نوع المورد</label>
            <input id="fType" placeholder="content_item, auth, ..." style="width:100%; padding:10px; border:1px solid var(--color-border); border-radius:8px;" /></div>
          <div class="field" style="margin:0;"><label>معرّف المورد</label>
            <input id="fId" style="width:100%; padding:10px; border:1px solid var(--color-border); border-radius:8px;" /></div>
          <div class="field" style="margin:0;"><label>الفاعل</label>
            <select id="fActor" style="width:100%; padding:10px; border:1px solid var(--color-border); border-radius:8px;">
              <option value="">الكل</option><option value="STAFF">موظف</option><option value="RESEARCHER">باحث خارجي</option><option value="SYSTEM">نظام</option>
            </select></div>
          <button class="btn btn-primary" style="width:auto; height:42px;" id="filterBtn">تصفية</button>
        </div>
      </div>

      <div class="card table-card">
        <table class="data-table">
          <thead><tr><th>الإجراء</th><th>المورد</th><th>الفاعل</th><th>IP</th><th>الوقت</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display:none;"><div class="avatar-lg"><svg class="icon" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5h10M7 10h10M7 15h10"/><circle cx="3.3" cy="5" r=".9"/><circle cx="3.3" cy="10" r=".9"/><circle cx="3.3" cy="15" r=".9"/></svg></div>لا توجد سجلات مطابقة</div>
      </div>
    </main>
  </div>
  <div id="toast" class="toast"><span id="toastText"></span></div>

  <script src="/js/api.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/shell.js"></script>
  <script>
    const ACTOR_LABELS = { STAFF: 'موظف', RESEARCHER: 'باحث خارجي', SYSTEM: 'نظام' };

    if (HBJ.requireAuth()) { renderShell('/settings.html'); load(); }
    document.getElementById('filterBtn').addEventListener('click', load);

    async function load() {
      try {
        const qs = new URLSearchParams();
        const type = document.getElementById('fType').value.trim();
        const rid = document.getElementById('fId').value.trim();
        const actor = document.getElementById('fActor').value;
        if (type) qs.set('resourceType', type);
        if (rid) qs.set('resourceId', rid);
        if (actor) qs.set('actorType', actor);

        const logs = await HBJ.api(`/audit-logs?${qs.toString()}`);
        const tbody = document.getElementById('tableBody');
        if (logs.length === 0) { document.getElementById('emptyState').style.display = 'block'; tbody.innerHTML=''; return; }
        document.getElementById('emptyState').style.display = 'none';
        tbody.innerHTML = logs.map((l) => `
          <tr>
            <td>${escapeHtml(l.actionType)}</td>
            <td>${escapeHtml(l.resourceType)}${l.resourceId ? ` (${l.resourceId.slice(0,8)}…)` : ''}</td>
            <td><span class="badge badge-neutral">${ACTOR_LABELS[l.actorType] || l.actorType}</span></td>
            <td style="direction:ltr; text-align:right; font-size:12px;">${escapeHtml(l.ipAddress || '—')}</td>
            <td>${new Date(l.timestamp).toLocaleString('ar-EG')}</td>
          </tr>
        `).join('');
      } catch (err) { showToast(err.message, true); }
    }

    function showToast(text, isError) {
      const toast = document.getElementById('toast');
      document.getElementById('toastText').textContent = text;
      toast.classList.toggle('error', !!isError);
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 4000);
    }
  </script>
</body>
</html>
